```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RoboLab - Make Project</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080e18;
    color: white;
    overflow: hidden;
}

header {
    height: 60px;
    background: #101a2a;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 25px;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

button {
    border: 0;
    padding: 9px 18px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

.home {
    background: #344258;
}

.run {
    background: #00a878;
}

.stop {
    background: #d9534f;
}

.main {
    height: calc(100vh - 60px);
    display: flex;
}

/* COMPONENT PANEL */

.sidebar {
    width: 230px;
    background: #111c2d;
    padding: 15px;
    overflow-y: auto;
}

.sidebar h3 {
    margin-top: 0;
}

.component {
    background: #1d2b40;
    padding: 13px;
    margin: 9px 0;
    border-radius: 7px;
    cursor: grab;
}

.component:hover {
    background: #29415f;
}

/* WORKSPACE */

.workspace {
    flex: 1;
    position: relative;
    overflow: hidden;

    background-color: #0b111c;

    background-image:
        linear-gradient(#182333 1px, transparent 1px),
        linear-gradient(90deg, #182333 1px, transparent 1px);

    background-size: 25px 25px;
}

/* COMPONENT ON BOARD */

.part {
    position: absolute;
    width: 170px;
    padding: 12px;
    background: #202d40;
    border: 2px solid #53657c;
    border-radius: 8px;
    cursor: move;
    user-select: none;
}

.part-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.pin {
    margin: 5px 0;
    font-size: 13px;
}

.pin-dot {
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #00c8ff;
    margin-right: 6px;
}

/* RIGHT PANEL */

.right {
    width: 300px;
    background: #111c2d;
    padding: 15px;
}

.simulator {
    height: 220px;
    background: #080d14;
    border: 1px solid #33465f;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
}

.road {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #20252b;
}

.car {
    position: absolute;
    font-size: 45px;
    left: 20px;
    top: 85px;
}

.obstacle {
    position: absolute;
    font-size: 40px;
    right: 25px;
    top: 88px;
}

.status {
    background: #1b293c;
    padding: 12px;
    margin-top: 12px;
    border-radius: 7px;
    font-size: 14px;
}

</style>
</head>

<body>

<header>

    <div class="logo">🤖 RoboLab</div>

    <button class="home"
            onclick="location.href='index.html'">
        Home
    </button>

    <button class="run" onclick="runSimulation()">
        ▶ Run
    </button>

    <button class="stop" onclick="stopSimulation()">
        ⏹ Stop
    </button>

</header>


<div class="main">

    <!-- COMPONENTS -->

    <aside class="sidebar">

        <h3>Components</h3>

        <div class="component"
             draggable="true"
             data-type="Arduino UNO">
            🔵 Arduino UNO
        </div>

        <div class="component"
             draggable="true"
             data-type="Breadboard">
            🟩 Breadboard
        </div>

        <div class="component"
             draggable="true"
             data-type="HC-SR04">
            📡 HC-SR04
        </div>

        <div class="component"
             draggable="true"
             data-type="L293D">
            ⚙️ L293D
        </div>

        <div class="component"
             draggable="true"
             data-type="DC Motor">
            🔵 DC Motor
        </div>

        <div class="component"
             draggable="true"
             data-type="Servo Motor">
            🔄 Servo Motor
        </div>

        <div class="component"
             draggable="true"
             data-type="LED">
            💡 LED
        </div>

        <div class="component"
             draggable="true"
             data-type="Resistor">
            🟫 Resistor
        </div>

        <div class="component"
             draggable="true"
             data-type="Battery">
            🔋 Battery
        </div>

    </aside>


    <!-- WORKSPACE -->

    <main class="workspace" id="workspace">
    </main>


    <!-- SIMULATOR -->

    <aside class="right">

        <h3>🚗 Simulation</h3>

        <div class="simulator">

            <div class="road"></div>

            <div class="car" id="car">
                🚗
            </div>

            <div class="obstacle">
                🧱
            </div>

        </div>

        <div class="status" id="status">
            Ready to run
        </div>

    </aside>

</div>


<script>

const workspace =
    document.getElementById("workspace");

const components =
    document.querySelectorAll(".component");


let simulation;


/* DRAG FROM COMPONENT PANEL */

components.forEach(component => {

    component.addEventListener("dragstart", event => {

        event.dataTransfer.setData(
            "component",
            component.dataset.type
        );

    });

});


/* ALLOW DROP */

workspace.addEventListener("dragover", event => {

    event.preventDefault();

});


/* CREATE COMPONENT */

workspace.addEventListener("drop", event => {

    event.preventDefault();

    const type =
        event.dataTransfer.getData("component");

    if (!type) return;

    const part =
        document.createElement("div");

    part.className = "part";

    part.style.left =
        (event.clientX - workspace.offsetLeft - 80) + "px";

    part.style.top =
        (event.clientY - workspace.offsetTop - 30) + "px";


    part.innerHTML = `

        <div class="part-title">
            ${type}
        </div>

        <div class="pin">
            <span class="pin-dot"></span>
            VCC
        </div>

        <div class="pin">
            <span class="pin-dot"></span>
            GND
        </div>

        <div class="pin">
            <span class="pin-dot"></span>
            SIGNAL
        </div>

    `;

    workspace.appendChild(part);

    makeMovable(part);

});


/* MOVE COMPONENT */

function makeMovable(part) {

    part.addEventListener("mousedown", event => {

        let startX =
            event.clientX - part.offsetLeft;

        let startY =
            event.clientY - part.offsetTop;


        function move(event) {

            part.style.left =
                (event.clientX - startX) + "px";

            part.style.top =
                (event.clientY - startY) + "px";

        }


        function stop() {

            document.removeEventListener(
                "mousemove",
                move
            );

            document.removeEventListener(
                "mouseup",
                stop
            );

        }


        document.addEventListener(
            "mousemove",
            move
        );

        document.addEventListener(
            "mouseup",
            stop
        );

    });

}


/* RUN */

function runSimulation() {

    const car =
        document.getElementById("car");

    const status =
        document.getElementById("status");

    let position = 20;

    status.innerHTML =
        "🚗 Car is moving...";


    simulation =
        setInterval(() => {

            position += 2;

            car.style.left =
                position + "px";


            if (position >= 190) {

                clearInterval(simulation);

                status.innerHTML =
                    "📡 Ultrasonic detected obstacle!";

            }

        }, 40);

}


/* STOP */

function stopSimulation() {

    clearInterval(simulation);

    document.getElementById("status").innerHTML =
        "⏹ Simulation stopped";

}

</script>

</body>
</html>
